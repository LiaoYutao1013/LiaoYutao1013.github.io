<div class="learning-panel glass" data-learning-calendar><div class="calendar">
  <div class="calendar-toolbar"><div><h3 id="calendar-month">学习日历</h3><span class="mono" id="calendar-english">DAILY LEARNING</span></div><div class="calendar-controls" hidden><button class="icon-button" id="prev-month" aria-label="上个月">{% include ui/icon.html name='chevron' class='reverse' %}</button><button id="calendar-today" class="small-button">今天</button><button class="icon-button" id="next-month" aria-label="下个月">{% include ui/icon.html name='chevron' %}</button></div></div>
  <div class="calendar-interactive" hidden><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="calendar-grid" id="calendar-grid" role="group" aria-label="选择日期筛选学习记录"></div><div class="calendar-legend"><span><i></i> 有学习记录</span><span>点击日期，回看当天的收获</span></div></div>
  <noscript><p>启用 JavaScript 可按日期查看，或直接阅读<a href="{{ '/learning/' | relative_url }}">完整记录</a>。</p></noscript>
</div><div class="learning-feed"><div class="feed-heading"><div><span class="eyebrow">DAILY LOG</span><h3 id="log-title">持续学习，持续记录</h3></div><a class="text-link" href="{{ '/learning/' | relative_url }}">全部记录</a></div><div class="log-list" id="log-list" aria-live="polite"><div class="empty-log">{% include ui/icon.html name='book' %}<span>学习笔记将在这里归档。</span></div></div><div class="feed-footer"><span>每一次理解，都向前一步。</span>{% include ui/icon.html name='book' %}</div></div></div>
<script type="application/json" id="learning-data">[
{% assign learning_entries = site.learning | where_exp: 'entry', 'entry.date <= site.time' | sort: 'date' | reverse %}
{% for entry in learning_entries %}{"date":{{ entry.date | date: '%Y-%m-%d' | jsonify }},"time":{{ entry.date | date: '%H:%M' | jsonify }},"title":{{ entry.title | jsonify | replace: '<', '\u003c' }},"summary":{{ entry.description | default: entry.excerpt | strip_html | strip_newlines | jsonify | replace: '<', '\u003c' }},"tags":{{ entry.tags | jsonify | replace: '<', '\u003c' }},"url":{{ entry.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
</script>
