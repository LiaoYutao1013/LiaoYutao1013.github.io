<!doctype html>
<html lang="{{ site.locale | default: 'zh-CN' | replace: '_', '-' }}" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#0B3D91">
{% include seo.html %}
{% if page.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="icon" href="{{ '/images/identity.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/identity.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/identity-layout.css' | relative_url }}">
<style>:root{--background-photo:url({{ site.data.identity.background | relative_url | jsonify }})}</style>
<script>try{var savedTheme=localStorage.getItem('ly-theme');document.documentElement.dataset.theme=savedTheme==='dark'||(!savedTheme&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(_){}</script>
<script src="{{ '/assets/js/identity.js' | relative_url }}" defer></script>
</head>
<body{% if page.workspace %} class="workspace-page"{% endif %}>
<a class="skip-link" href="#main">跳到主要内容</a>
{% include ui/icons.html %}
{% unless page.workspace %}{% include ui/navigation.html %}{% endunless %}
{{ content }}
{% unless page.workspace %}{% include ui/footer.html %}{% endunless %}
{% include analytics.html %}
</body>
</html>
